<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard | AEW</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
html{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0b0d;--panel:#0e0f12;--raise:#121418;--line:#24272d;--line-2:#2e3238;
  --txt:#eceef1;--txt-2:#b6bcc5;--mut:#9097a2;--faint:#858b96;
  --acc:#ff7a1a;--acc-hi:#ffa15a;--acc-br:#ff8f3a;--on-acc:#140a04;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body{font-family:var(--sans);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;min-height:100vh}
.hdr{background:rgba(10,11,13,.94);border-bottom:1px solid var(--line);color:var(--txt);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.hdr-l{display:flex;align-items:center;gap:12px}
.hdr-logo{width:32px;height:32px;border-radius:8px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;font-weight:900;color:var(--on-acc)}
.hdr-name{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em}
.hdr-r{display:flex;align-items:center;gap:10px}
.uchip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;background:var(--raise);border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--txt-2)}
.uav{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--on-acc)}
.hdr-btn{min-height:36px;padding:0 14px;background:transparent;border:1px solid var(--line-2);color:var(--txt-2);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;transition:border-color .15s,color .15s;font-family:inherit}
.hdr-btn:hover{border-color:rgba(255,255,255,.3);color:var(--txt)}
.body{max-width:1080px;margin:0 auto;padding:40px 24px 64px}
.welcome{margin-bottom:36px}
.welcome-tag{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--acc-br);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.welcome-h{font-family:var(--display);font-size:34px;font-weight:800;color:var(--txt);letter-spacing:-.03em;margin-bottom:6px;line-height:1.1}
.welcome-sub{font-size:14px;color:var(--mut)}
.section-t{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:32px}
.prod-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;transition:border-color .2s,transform .2s,background .2s;cursor:pointer;position:relative;overflow:hidden;text-decoration:none;display:block;color:inherit}
.prod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--line-2)}
.pc-g::before{background:var(--acc)}
.prod-card:hover{border-color:rgba(255,122,26,.5);background:var(--raise);transform:translateY(-2px)}
.prod-card.locked{cursor:not-allowed;opacity:.6}
.prod-card.locked:hover{transform:none;border-color:var(--line);background:var(--panel)}
.prod-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px;font-weight:600;margin-bottom:16px;background:var(--raise);border:1px solid var(--line);color:var(--txt-2)}
.pi-g{background:rgba(255,122,26,.10);border-color:rgba(255,122,26,.35);color:var(--acc-br)}
.prod-h{font-family:var(--display);font-size:17px;font-weight:700;color:var(--txt);margin-bottom:6px;letter-spacing:-.01em}
.prod-p{font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:16px}
.prod-status{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:500;padding:3px 9px;border-radius:12px;text-transform:uppercase;letter-spacing:.04em}
.ps-live{background:rgba(255,122,26,.12);color:var(--acc-hi)}
.ps-soon{background:var(--raise);color:var(--mut)}
.prod-arrow{position:absolute;bottom:20px;right:20px;font-size:16px;color:var(--mut);transition:color .2s,transform .2s}
.prod-card:not(.locked):hover .prod-arrow{color:var(--acc-br);transform:translateX(3px)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat-l{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-v{font-family:var(--display);font-size:24px;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.stat-s{font-size:11.5px;color:var(--faint);margin-top:4px}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px}
/* Opacity only: a scale pulse on a 56px box forces layout-adjacent
   repaints every frame, and this is on screen during sign-in. */
.load-logo{width:56px;height:56px;border-radius:14px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;font-weight:900;color:var(--on-acc);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.load-t{font-size:14px;font-weight:500;color:var(--mut)}
@media(max-width:768px){.prod-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.hdr{padding:0 16px}.hdr-name{display:none}}
@media(max-width:500px){.prod-grid,.stats{grid-template-columns:1fr}.uchip span{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- LOADING OVERLAY (shown until auth check completes) -->
<div id="loading">
  <div class="load-logo">A</div>
  <div class="load-t">Loading your dashboard...</div>
</div>

<header class="hdr" id="hdr" style="display:none">
  <div class="hdr-l">
    <div class="hdr-logo">A</div>
    <div class="hdr-name">AEW Manufacturing Intelligence</div>
  </div>
  <div class="hdr-r">
    <div class="uchip">
      <div class="uav" id="uav" style="background:#ff7a1a">A</div>
      <span id="uname">Loading...</span>
    </div>
    <button class="hdr-btn" onclick="signOut()">Sign out</button>
  </div>
</header>

<div class="body" id="body" style="display:none">
  <div class="welcome">
    <div class="welcome-tag" id="company-tag">Your Company</div>
    <div class="welcome-h">Welcome back, <span id="first-name">there</span>.</div>
    <div class="welcome-sub" id="welcome-sub">Here are your tools and dashboards.</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-l">Products Active</div><div class="stat-v" id="stat-products">0</div><div class="stat-s">in your account</div></div>
    <div class="stat"><div class="stat-l">Quotations</div><div class="stat-v">—</div><div class="stat-s">coming soon</div></div>
    <div class="stat"><div class="stat-l">Last Login</div><div class="stat-v" id="stat-login">—</div><div class="stat-s">your account</div></div>
    <div class="stat"><div class="stat-l">Account Role</div><div class="stat-v" id="stat-role">—</div><div class="stat-s">access level</div></div>
  </div>

  <div class="section-t">Your Products</div>
  <div class="prod-grid" id="prod-grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js?v=2026.09.13-1"></script>
<script src="assets/js/supabase.js?v=2026.09.13-1"></script>
<script src="assets/js/session.js?v=2026.09.13-1"></script>
<script src="assets/js/router.js?v=2026.09.13-1"></script>
<script src="assets/js/auth.js?v=2026.09.13-1"></script>
<script src="assets/js/ui.js?v=2026.09.13-1"></script>
<script src="assets/js/api.js?v=2026.09.13-1"></script>
<script src="assets/js/common.js?v=2026.09.13-1"></script>
<script>
/* dashboard.html */
var _PRODS = {
  costing:  { label:'Product Costing ERP',    icon:'₹', desc:'Costs a hydraulic cylinder from a few inputs, calculated exactly as the VERSION 1 workbook does.',  live:true,  cc:'pc-g', ic:'pi-g' },
  cbam:     { label:'Carbon Tracking (CBAM)', icon:'CO₂', desc:'CBAM carbon footprint per tonne. EU compliance declaration PDF.', live:false, cc:'pc-a', ic:'pi-a' },
  vibration:{ label:'Vibration AI',           icon:'~',      desc:'Upload an FFT photo. AI identifies faults before machines fail.',  live:false, cc:'pc-b', ic:'pi-b' },
  asset:    { label:'Asset Management',       icon:'⚙', desc:'QR codes per machine. Maintenance history. Depreciation.',         live:false, cc:'pc-p', ic:'pi-p' }
};

document.addEventListener('DOMContentLoaded', function () {
  AEW.auth.requireAuth(function (user) { renderDashboard(user); });
});

function renderDashboard(user) {
  var meta    = (user && user.user_metadata) || {};
  var name    = meta.name    || (user && user.email) || 'User';
  var first   = name.split(' ')[0];
  var company = meta.company || 'Your Company';
  var role    = meta.role    || 'viewer';
  var prods   = Array.isArray(meta.products) ? meta.products : ['costing'];
  var avatar  = meta.avatar  || first[0].toUpperCase();
  /* Accounts created before 2026-09-11 carry the retired emerald as their
     avatar colour; they get the current accent instead of a green chip. */
  var color   = (!meta.color || meta.color === '#059669') ? '#ff7a1a' : meta.color;

  AEW.ui.setText('uname', name);       AEW.ui.setText('uav', avatar);
  AEW.ui.setStyle('uav','background',color);
  AEW.ui.setText('company-tag', company); AEW.ui.setText('first-name', first);
  AEW.ui.setText('welcome-sub',
    company + ' · ' + role[0].toUpperCase() + role.slice(1) +
    ' · ' + prods.length + ' product' + (prods.length > 1 ? 's' : '') + ' active');
  AEW.ui.setText('stat-products', prods.length);
  AEW.ui.setText('stat-role', role[0].toUpperCase() + role.slice(1));
  AEW.ui.setText('stat-login', new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'}));

  var isAdmin = (role === 'admin');
  var keys    = isAdmin ? Object.keys(_PRODS) : prods;
  var routes  = window.AEW.config.ROUTES.products;
  var grid    = document.getElementById('prod-grid');
  if (!grid) { showApp(); return; }

  grid.innerHTML = keys.map(function (key) {
    var p   = _PRODS[key]; if (!p) return '';
    var has = isAdmin || (prods.indexOf(key) !== -1);
    var locked = !has || !p.live;
    var href   = locked ? '#' : (routes[key] || '#');
    var oc = '';
    if (!has)       oc = ' onclick="lockedAlert(event)"';
    else if (!p.live) oc = ' onclick="event.preventDefault()"';
    var badge = p.live && has ? 'Active' : p.live ? 'Locked' : 'Coming Soon';
    var bClass = p.live && has ? 'ps-live' : 'ps-soon';
    return '<a href="' + href + '" class="prod-card ' + p.cc + (locked ? ' locked' : '') + '"' + oc + '>' +
      '<div class="prod-icon ' + p.ic + '">' + p.icon + '</div>' +
      '<div class="prod-h">' + p.label + '</div>' +
      '<div class="prod-p">' + p.desc  + '</div>' +
      '<span class="prod-status ' + bClass + '">' + badge + '</span>' +
      (!locked ? '<div class="prod-arrow">→</div>' : '') + '</a>';
  }).join('');
  showApp();
}

function lockedAlert(e) { e.preventDefault(); alert('Not in your plan. Contact AEW to upgrade.'); }
function showApp() {
  AEW.ui.hide('loading'); AEW.ui.show('hdr','flex'); AEW.ui.show('body','block');
}
function doSignOut() { AEW.auth.logout(); }
window.doSignOut   = doSignOut;
window.signOut     = doSignOut;
window.lockedAlert = lockedAlert;
</script>
</body>
</html>
