<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset password | AEW</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600..900&family=Geist:wght@300..700&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet">
<style>
html{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0b0d;--panel:#0e0f12;--raise:#121418;--line:#24272d;--line-2:#2e3238;
  --txt:#eceef1;--txt-2:#b6bcc5;--mut:#9097a2;--faint:#858b96;
  --acc:#ff7a1a;--acc-hi:#ffa15a;--acc-br:#ff8f3a;--on-acc:#140a04;
  --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
body{font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 50% at 50% 0%,rgba(255,122,26,.10),transparent 70%),var(--bg);color:var(--txt);padding:24px;-webkit-font-smoothing:antialiased}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:40px;width:100%;max-width:420px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.lm{width:36px;height:36px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px;font-weight:900;color:var(--on-acc)}
.lt{font-family:var(--display);font-size:16px;font-weight:800;color:var(--txt)}
.card-h{font-family:var(--display);font-size:26px;font-weight:800;color:var(--txt);letter-spacing:-.02em;margin-bottom:6px}
.card-s{font-size:14px;color:var(--mut);margin-bottom:28px;line-height:1.5}
.field{margin-bottom:16px}

.alert{border-radius:8px;padding:12px 14px;font-size:13px;margin-bottom:18px;display:none;align-items:center;gap:10px;line-height:1.5}
.a-err{background:rgba(248,113,113,.10);border:1px solid rgba(248,113,113,.35);color:#fca5a5}
.a-ok{background:rgba(255,122,26,.10);border:1px solid rgba(255,122,26,.40);color:var(--acc-hi)}
.field label{display:block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--txt-2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.field input{width:100%;height:46px;padding:0 14px;border:1px solid var(--line-2);border-radius:8px;font-size:15px;font-weight:500;color:var(--txt);font-family:inherit;background:var(--raise);transition:border-color .15s,box-shadow .15s}
.field input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,122,26,.18)}
.field input.ferr{border-color:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.15)}
.field input::placeholder{color:var(--faint);font-weight:400}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.hint{font-size:11.5px;color:var(--faint);margin-top:6px}
.btn{width:100%;height:48px;border:none;border-radius:8px;font-size:15px;font-weight:600;color:var(--on-acc);background:var(--acc);cursor:pointer;font-family:inherit;margin-top:8px;transition:background .15s,transform .1s}
.btn:hover{background:var(--acc-hi)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.back{display:flex;align-items:center;justify-content:center;min-height:40px;font-size:13px;color:var(--mut);margin-top:16px;text-decoration:none}
.back:hover{color:var(--acc-br)}

/* Show / hide password. A text button, not only an icon: "Show" says what
   it does to someone who has never seen the eye convention. */
.pw{position:relative}
.pw input{padding-right:84px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--txt-2);font:600 12.5px var(--sans);cursor:pointer;transition:color .15s,background .15s}
.pw-eye:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.pw-eye:focus-visible{outline:2px solid var(--acc-br);outline-offset:1px}
.pw-eye svg{width:16px;height:16px;flex:none}
.pw-eye .off{display:none}
.pw-eye[aria-pressed="true"] .on{display:none}
.pw-eye[aria-pressed="true"] .off{display:block}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="lm">A</div><div class="lt">AEW Platform</div></div>
  <div class="card-h">Set new password</div>
  <div class="card-s">Enter a strong new password for your account. You will be signed in automatically.</div>

  <div class="alert a-ok" id="a-ok"><span>✓</span><span id="ok-msg">Password updated. Redirecting...</span></div>
  <div class="alert a-err" id="a-err"><span>⚠</span><span id="err-msg">Something went wrong.</span></div>

  <div class="field">
    <label for="pw1">New Password</label>
    <div class="pw"><input id="pw1" type="password" placeholder="Minimum 8 characters" autocomplete="new-password"><button type="button" class="pw-eye" data-pw="pw1" aria-controls="pw1" aria-pressed="false" aria-label="Show password"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.7 3.6M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><span class="pw-t">Show</span></button></div>
    <div class="hint">At least 8 characters. Use a mix of letters, numbers and symbols.</div>
  </div>
  <div class="field">
    <label for="pw2">Confirm Password</label>
    <div class="pw"><input id="pw2" type="password" placeholder="Type it again" autocomplete="new-password" onkeydown="if(event.key==='Enter')reset()"><button type="button" class="pw-eye" data-pw="pw2" aria-controls="pw2" aria-pressed="false" aria-label="Show password"><svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.7 3.6M6.6 6.6C3.9 8.3 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg><span class="pw-t">Show</span></button></div>
  </div>
  <button class="btn" id="btn" onclick="reset()">Update password</button>
  <a href="login.html" class="back">← Back to sign in</a>
</div>

<script>
/* Show / hide on password fields. Switching the input's type keeps the
   value, the caret and the password manager's hooks, which a mirrored
   text field would lose. */
(function () {
  'use strict';
  Array.prototype.forEach.call(document.querySelectorAll('[data-pw]'), function (b) {
    b.addEventListener('click', function () {
      var el = document.getElementById(b.getAttribute('data-pw'));
      if (!el) return;
      var show = el.type === 'password';
      el.type = show ? 'text' : 'password';
      b.setAttribute('aria-pressed', show ? 'true' : 'false');
      b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      b.querySelector('.pw-t').textContent = show ? 'Hide' : 'Show';
      el.focus();
    });
  });
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js?v=2026.09.13-1"></script>
<script src="assets/js/supabase.js?v=2026.09.13-1"></script>
<script src="assets/js/session.js?v=2026.09.13-1"></script>
<script src="assets/js/router.js?v=2026.09.13-1"></script>
<script src="assets/js/auth.js?v=2026.09.13-1"></script>
<script src="assets/js/ui.js?v=2026.09.13-1"></script>
<script src="assets/js/api.js?v=2026.09.13-1"></script>
<script src="assets/js/common.js?v=2026.09.13-1"></script>
<script>
/* reset-password.html */
function doReset() {
  var p1 = (document.getElementById('pw1').value || '');
  var p2 = (document.getElementById('pw2').value || '');
  var btn = document.getElementById('btn');
  AEW.ui.hide('a-err'); AEW.ui.hide('a-ok');
  if (p1.length < 8) { showErr('Password must be at least 8 characters.'); return; }
  if (p1 !== p2)     { showErr('Passwords do not match.'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Updating...'; }
  AEW.auth.updatePassword(p1).then(function (r) {
    if (r && r.error) {
      showErr('Link may have expired. Request a new reset email from the login page.');
      if (btn) { btn.disabled = false; btn.textContent = 'Update password'; }
      return;
    }
    AEW.ui.show('a-ok','flex');
    AEW.ui.setText('ok-msg', 'Password updated. Signing you out...');
    AEW.auth.logout();
  }).catch(function () {
    showErr('Something went wrong. Please try again.');
    if (btn) { btn.disabled = false; btn.textContent = 'Update password'; }
  });
}
function showErr(msg) {
  AEW.ui.show('a-err','flex'); AEW.ui.setText('err-msg', msg);
}
window.doReset = doReset;
window.reset   = doReset;
</script>
</body>
</html>
