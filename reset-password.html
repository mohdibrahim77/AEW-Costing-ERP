<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password — AEW Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1b2a,#1e3a5f);padding:24px}
.card{background:#fff;border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:0 32px 80px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.lm{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#1e3a5f,#059669);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff}
.lt{font-size:16px;font-weight:800;color:#0f172a}
.card-h{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:-.02em;margin-bottom:6px}
.card-s{font-size:14px;color:#64748b;margin-bottom:28px;line-height:1.5}
.alert{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px;display:none;align-items:center;gap:10px}
.a-ok{background:#f0fdf4;border:1px solid #a7f3d0;color:#064e3b}
.a-err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;color:#374151;letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px}
.field input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-weight:500;color:#0f172a;font-family:inherit;transition:all .15s}
.field input:focus{outline:none;border-color:#059669;box-shadow:0 0 0 3px rgba(5,150,105,.1)}
.hint{font-size:11px;color:#94a3b8;margin-top:5px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#059669,#047857);cursor:pointer;font-family:inherit;margin-top:8px;transition:all .2s}
.btn:hover{box-shadow:0 6px 20px rgba(5,150,105,.35);transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.back{display:block;text-align:center;font-size:13px;color:#64748b;margin-top:20px;text-decoration:none}
.back:hover{color:#059669}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="lm">A</div><div class="lt">AEW Platform</div></div>
  <div class="card-h">Set new password</div>
  <div class="card-s">Enter a strong new password for your account. You will be signed in automatically.</div>

  <div class="alert a-ok" id="a-ok"><span>✓</span><span id="ok-msg">Password updated. Redirecting...</span></div>
  <div class="alert a-err" id="a-err"><span>⚠</span><span id="err-msg">Something went wrong.</span></div>

  <div class="field">
    <label>New Password</label>
    <input id="pw1" type="password" placeholder="Minimum 8 characters">
    <div class="hint">At least 8 characters. Use a mix of letters, numbers and symbols.</div>
  </div>
  <div class="field">
    <label>Confirm Password</label>
    <input id="pw2" type="password" placeholder="Type it again" onkeydown="if(event.key==='Enter')reset()">
  </div>
  <button class="btn" id="btn" onclick="reset()">Update password</button>
  <a href="login.html" class="back">← Back to sign in</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js?v=2026.08.02-1"></script>
<script src="assets/js/supabase.js?v=2026.08.02-1"></script>
<script src="assets/js/session.js?v=2026.08.02-1"></script>
<script src="assets/js/router.js?v=2026.08.02-1"></script>
<script src="assets/js/auth.js?v=2026.08.02-1"></script>
<script src="assets/js/ui.js?v=2026.08.02-1"></script>
<script src="assets/js/api.js?v=2026.08.02-1"></script>
<script src="assets/js/common.js?v=2026.08.02-1"></script>
<script>
/* reset-password.html */
function doReset() {
  var p1 = (document.getElementById('pw1').value || '');
  var p2 = (document.getElementById('pw2').value || '');
  var btn = document.getElementById('btn');
  AEW.ui.hide('a-err'); AEW.ui.hide('a-ok');
  if (p1.length < 8) { showErr('Password must be at least 8 characters.'); return; }
  if (p1 !== p2)     { showErr('Passwords do not match.'); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Updating...'; }
  AEW.auth.updatePassword(p1).then(function (r) {
    if (r && r.error) {
      showErr('Link may have expired. Request a new reset email from the login page.');
      if (btn) { btn.disabled = false; btn.textContent = 'Update password'; }
      return;
    }
    AEW.ui.show('a-ok','flex');
    AEW.ui.setText('ok-msg', 'Password updated. Signing you out...');
    AEW.auth.logout();
  }).catch(function () {
    showErr('Something went wrong. Please try again.');
    if (btn) { btn.disabled = false; btn.textContent = 'Update password'; }
  });
}
function showErr(msg) {
  AEW.ui.show('a-err','flex'); AEW.ui.setText('err-msg', msg);
}
window.doReset = doReset;
window.reset   = doReset;
</script>
</body>
</html>
